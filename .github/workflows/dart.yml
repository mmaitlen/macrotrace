name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (Required for Android-related tasks/Flutter)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # cache: true # Optional: speeds up subsequent runs

      # 4. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Static Analysis (Linter)
      - name: Analyze code
        run: flutter analyze

      # 6. Run Unit and Widget Tests
      - name: Run tests
        run: flutter test


